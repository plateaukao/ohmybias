<h2>OhMyBias 米 輸入法</h2>
<p>極簡的 macOS 嘸蝦米（Boshiamy）輸入法 — 打字、查碼、繁簡轉換、字頻學習，約 2MB。</p>
<p>安裝程式會把 OhMyBiasIM.app 裝到 <b>/Library/Input Methods/</b>。</p>
<p>安裝後需要你自備合法取得的 <b>liu.cin</b> 字表，首次切換到 OhMyBias 時會引導匯入。</p>
</body>
